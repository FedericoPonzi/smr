[package]
name = "smr"
version = "0.1.0"
edition = "2021"
authors = ["Federico Ponzi <me@fponzi.me>"]

[dependencies]
anyhow = "~1.0"
thiserror = "~1.0"
log = "~0.4"
env_logger = "~0.11"

[dev-dependencies]
rand = "0.8.5"
hyper = { version = "0.14.26", features = ["client", "server", "http1", "tcp"] }
tokio = { version = "1.27", features = ["rt", "time", "macros", "sync"] }
bytes = { version = "1.6.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
