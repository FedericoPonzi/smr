[package]
name = "smr"
version = "0.1.0"
edition = "2024"
authors = ["Federico Ponzi <me@fponzi.me>"]
description = "State Machine Replication library for studying consensus algorithms (Paxos, Multi-Paxos)"
license = "MIT"
repository = "https://github.com/FedericoPonzi/smr"
readme = "README.md"
keywords = ["paxos", "consensus", "replication", "distributed-systems", "state-machine"]
categories = ["algorithms", "network-programming"]

[[example]]
name = "kvstore"
path = "examples/kvstore/main.rs"

[[example]]
name = "counter"
path = "examples/counter/main.rs"

[dependencies]
anyhow = "~1.0"
thiserror = "2.0.11"
log = "~0.4"
env_logger = "~0.11"
serde = { version = "~1.0", features = ["derive"] }
serde_json = { version = "~1.0" }
tokio = { version = "~1.43", features = ["full"] }
tracing = "~0.1"
rand = "~0.9"
bincode = { version = "~2.0", features = ["serde"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
static_assertions = "1.1.0"
sled = { version = "0.34.7", optional = true }
rocksdb = { version = "0.24.0", optional = true }

[dev-dependencies]
rocket = { version = "~0.5", features = ["json"] }
tracing-subscriber = { version = "~0.3", features = ["env-filter", "json"] }
tempfile = "~3.26"

[features]
default = ["sled"]
sled = ["dep:sled"]
rocksdb = ["dep:rocksdb"]
